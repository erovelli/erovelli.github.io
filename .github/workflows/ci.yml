name: CI

# Runs on pull requests and on direct pushes to main. The push trigger matters:
# nothing forces changes through a PR on a personal repo, and without it a direct
# commit to main would reach the deploy workflow as its first check.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # format:check, astro check, build, then check-build.mjs against dist.
      - name: Validate site
        run: npm run validate
