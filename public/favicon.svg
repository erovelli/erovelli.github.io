<!--
  Source of truth for every site icon (favicon, PWA icons, apple-touch-icon).
  Deliberately geometry-only: no <text>, so rasterisation does not depend on
  font availability and looks identical on every machine and in CI.

  Colours are hardcoded rather than tokenised because this file is rasterised
  outside the CSS pipeline. If the brand palette in src/styles/global.css
  changes, update these three values and run `npm run assets`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Evan Rovelli">
  <rect width="64" height="64" rx="14" fill="#1a1b16" />
  <g fill="#f4f2ec">
    <rect x="18" y="16" width="8" height="32" />
    <rect x="18" y="16" width="28" height="8" />
    <rect x="18" y="40" width="28" height="8" />
  </g>
  <rect x="18" y="28" width="20" height="8" fill="#a8341c" />
</svg>
